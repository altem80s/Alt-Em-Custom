<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="description" content="Alt Em Custom — leather, lace, and everything retro.">
    <link rel="icon" type="image/svg+xml" href="/Alt-Em-Custom/LogoTB-favicon.svg?v=1">
    <link rel="stylesheet" href="styles.css">
    <title>Alt Em Custom | Home</title>
</head>
<body class="home-page">
<header class="home-header">
    <a class="home-brand" href="index.html" aria-label="Alt Em Custom home">
        <img src="LayLogoTB.jpg" alt="Alt Em Custom logo">
    </a>
    <nav class="home-nav" aria-label="Main navigation">
        <a href="index.html" aria-current="page">Home</a>
        <a href="shop.html">Shop</a>
        <a href="patterns.html">Patterns</a>
    </nav>
    <div class="home-header-icons" aria-hidden="true">
        <span class="header-icon header-search"></span>
        <span class="header-icon header-account"></span>
        <span class="header-icon header-bag"></span>
    </div>
</header>

<main>
    <section class="home-hero" aria-label="Alt Em Custom">
        <h1 class="home-hero-title">ALT<br>EM</h1>
        <div class="home-walker">
            <img src="Walker.png" alt="Model wearing an Alt Em Custom design">
        </div>
    </section>

    <div class="home-scroll-mark" aria-hidden="true"><span></span></div>

    <section class="featured-product" aria-label="Featured coat">
        <h2>Featured Product</h2>
        <div class="coat-callout callout-fur"><span>Ethically sourced fur</span><i></i></div>
        <div class="coat-callout callout-wool"><i></i><span>High quality wool</span></div>
        <div class="coat-callout callout-handmade"><span>Handmade locally</span><i></i></div>
        <div class="coat-stage">
            <img class="featured-coat" src="coat.png" alt="Featured Alt Em Custom coat">
        </div>
        <div class="coat-actions">
            <a href="patterns.html">Make This</a>
            <a href="shop.html">Buy This</a>
        </div>
    </section>
</main>

<footer class="site-footer noir">
    <div class="wrap">
        <img src="LayLogoTB.jpg" alt="Alt Em Custom logo">
        <p>Hand-sewn by Emma Shaw</p>
        <p>Leather, lace, and everything retro.</p>
    </div>
</footer>
</body>
</html>
