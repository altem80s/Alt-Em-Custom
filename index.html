<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="description" content="Alt Em Custom — leather, lace, and everything retro.">
    <link rel="icon" type="image/png" href="LayLogoTB.png">
    <link rel="stylesheet" href="styles.css">
    <title>Alt Em Custom | Home</title>
</head>
<body class="home-page">
<header class="home-header">
    <a class="home-brand" href="index.html" aria-label="Alt Em Custom home">
        <img src="LayLogoTB.png" alt="Alt Em Custom logo">
    </a>
    <nav class="home-nav" aria-label="Main navigation">
        <a href="index.html" aria-current="page">Home</a>
        <a href="shop.html">Shop</a>
        <a href="patterns.html">Portfolio</a>
    </nav>
    <div class="home-header-icons" aria-hidden="true">
        <span class="header-icon header-search"></span>
        <span class="header-icon header-account"></span>
        <span class="header-icon header-bag"></span>
    </div>
</header>

<main>
    <!-- Scroll-driven dress transformation: step 1 separates into step 3 + step 2 -->
    <section class="dress-scroll" id="dress-scroll" aria-label="The dress separates from the model as you scroll">
        <div class="dress-scroll-sticky">
            <div class="dress-hero-state">
                <h1 class="dress-hero-title">ALT<br>EM</h1>
                <img class="dress-model dress-model-step1" src="step1.webp"
                     alt="Model wearing the complete white dress">
            </div>

            <div class="dress-product-state" aria-label="Featured dress">
                <h2 class="dress-featured-title">Featured Product</h2>
                <img class="dress-model dress-model-step3" src="step3.webp"
                     alt="Model after the white dress has been removed">
                <img class="dress-floating" src="step2.webp"
                     alt="The white dress separated from the model">

                <div class="dress-callout dress-callout-fur">
                    <span>Ethically sourced details</span><i></i>
                </div>
                <div class="dress-callout dress-callout-wool">
                    <i></i><span>Quality materials</span>
                </div>
                <div class="dress-callout dress-callout-handmade">
                    <span>Handmade locally</span><i></i>
                </div>
                <div class="dress-product-actions">
                    <a href="patterns.html">Make This</a>
                    <a href="shop.html">Buy This</a>
                </div>
            </div>
            <div class="dress-scroll-hint" aria-hidden="true"><span></span></div>
        </div>
    </section>
</main>

<footer class="site-footer noir">
    <div class="wrap">
        <img src="LayLogoTB.png" alt="Alt Em Custom logo">
        <p>Hand-sewn by Emma Shaw</p>
        <p>Leather, lace, and everything retro.</p>
    </div>
</footer>

<script>
(() => {
    const section = document.querySelector(".dress-scroll");
    const stage = document.querySelector(".dress-scroll-sticky");
    if (!section || !stage) return;

    const reduceMotion = window.matchMedia("(prefers-reduced-motion: reduce)").matches;
    if (reduceMotion) {
        section.classList.add("dress-animation-reduced");
        return;
    }

    let ticking = false;

    const clamp = (value, min = 0, max = 1) => Math.min(max, Math.max(min, value));

    function updateDressScene() {
        const rect = section.getBoundingClientRect();
        const travel = Math.max(1, section.offsetHeight - window.innerHeight);
        const progress = clamp(-rect.top / travel);

        const step1Opacity = 1 - clamp(progress / 0.38);
        const step3Opacity = clamp((progress - 0.12) / 0.32);
        const productOpacity = clamp((progress - 0.22) / 0.38);
        const modelShift = progress * 13;
        const dressShiftX = progress * 10;
        const dressShiftY = progress * -18;
        const dressScale = 1 - progress * 0.24;

        stage.style.setProperty("--step1-opacity", step1Opacity);
        stage.style.setProperty("--step3-opacity", step3Opacity);
        stage.style.setProperty("--product-opacity", productOpacity);
        stage.style.setProperty("--model-shift", modelShift + "vw");
        stage.style.setProperty("--dress-shift-x", dressShiftX + "vw");
        stage.style.setProperty("--dress-shift-y", dressShiftY + "vh");
        stage.style.setProperty("--dress-scale", dressScale);
        stage.style.setProperty("--hero-title-opacity", 1 - productOpacity);
        stage.style.setProperty("--hint-opacity", 1 - clamp(progress * 3));

        ticking = false;
    }

    function requestUpdate() {
        if (!ticking) {
            window.requestAnimationFrame(updateDressScene);
            ticking = true;
        }
    }

    window.addEventListener("scroll", requestUpdate, { passive: true });
    window.addEventListener("resize", requestUpdate);
    updateDressScene();
})();
</script>
</body>
</html>
